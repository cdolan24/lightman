schema: spec-driven

context: |
  Lightman runs on a Raspberry Pi 5 plugged into a car's OBD-II port and must stay drag-and-drop:
  no hardwiring into the ECU, no desktop/GUI dependencies on the Pi. Tune authoring, voice training
  data and local model updates belong to a separate companion app (docs/companion-app.md), not this repo.
  Tune safety (GitHub #1, docs/open-issues/tune-safety.md) gates features: recommendations are advisory
  only; auto may only select profiles; voice/auto never approve tunes; no live/flash ECU backend or tune
  generation until validation, safety envelope and API authentication exist.
  All behaviour must be testable without hardware (inject connections/clocks); hardware tests are
  marked @pytest.mark.hardware.

